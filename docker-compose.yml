version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: consync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: consync
      POSTGRES_USER: consync
      POSTGRES_PASSWORD: consync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
